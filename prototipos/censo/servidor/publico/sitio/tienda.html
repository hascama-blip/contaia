<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda · C.C. Inmaculada Concepción</title>
<link rel="icon" href="/img/favicon.ico" sizes="48x48">
<meta name="theme-color" content="#2aa7c0">
<link rel="stylesheet" href="/estilos/tokens.css">
<link rel="stylesheet" href="/sitio/sitio.css">
</head>
<body>
<header class="cab"><div class="contenedor cab-in">
  <a class="marca" href="/"><img src="/img/logo.jpg" alt=""><span id="marca-nombre">C.C. Inmaculada Concepción<small>Perfil de tienda</small></span></a>
  <div class="cab-acciones"><a class="btn btn-primario btn-sm" href="/tiendas">← Todas las tiendas</a></div>
</div></header>
<main class="contenedor" id="perfil"><p style="padding:40px 0;text-align:center;color:var(--texto-3)">Cargando…</p></main>
<script src="/sitio/comun.js"></script>
<script>
// Página de ofertas de una tienda: datos básicos (logo, nombre, stand, galería, horario, categorías,
// descripción), WhatsApp y, si lo cargó, el enlace a su perfil digital; luego sus ofertas. Los detalles
// (catálogo, QR, redes, cómo llegar) viven en el perfil digital externo, no aquí.
(async function () {
  const $ = (s) => document.querySelector(s);
  const id = decodeURIComponent(location.pathname.split("/")[2] || ""), artId = new URLSearchParams(location.search).get("art");
  let d; try { d = await S.pedir("GET", `/api/publico/tienda/${encodeURIComponent(id)}`); } catch { location.replace("/"); return; }
  const { sitio, tienda: t, articulos } = d;
  const cat = new Map(sitio.categorias.map((c) => [c.id, c]));
  document.title = `${t.nombre} · Ofertas · ${sitio.nombre}`;
  $("#marca-nombre").firstChild.textContent = sitio.nombre.replace(/^Centro Comercial/i, "C.C.");
  const art = articulos.find((a) => a.id === artId);
  const saludo = `Hola ${t.nombre}, los vi en la web de ${sitio.nombre}.${art ? ` Me interesa: ${art.nombre}${art.precioOferta ? ` (oferta ${S.soles(art.precioOferta)})` : ""}.` : ""}`;
  const cx = S.contacto(t);
  const tarjeta = (a) => `<article class="art" ${a.id === artId ? 'style="outline:3px solid var(--accent-400)"' : ""}>
      <div class="art-foto">${a.foto ? `<img src="${S.blob(a.foto)}" alt="${S.esc(a.nombre)}" loading="lazy">` : `<span class="sin-foto">${S.icono("foto")}</span>`}${S.pill(a, sitio.tiposOferta)}</div>
      <div class="art-cuerpo"><h3>${S.esc(a.nombre)}</h3>${S.precio(a)}<div class="desc">${S.esc(a.descripcion || "")}</div>${t.whatsapp ? `<a class="btn btn-wa btn-sm" href="${S.wa(t.whatsapp, `Hola ${t.nombre}, vi en la web de ${sitio.nombre} su oferta "${a.nombre}"${a.precioOferta ? ` (${S.soles(a.precioOferta)})` : ""}. ¿Sigue disponible?`)}" target="_blank" rel="noopener">Preguntar por WhatsApp</a>` : ""}</div></article>`;
  const tipos = [...new Set(articulos.map((a) => S.tipo(a, sitio.tiposOferta)?.nombre))].filter(Boolean);
  $("#perfil").innerHTML = `
    <section class="perfil-hero">${S.logo(t)}<div style="flex:1;min-width:220px"><h1>${S.esc(t.nombre)}</h1><p>${S.esc([t.stand, t.piso, t.horario].filter(Boolean).join(" · "))}</p><div class="etiquetas" style="margin-top:8px">${(t.categorias || []).map((c) => cat.get(c)).filter(Boolean).map((c) => `<span class="etiqueta">${S.esc(c.nombre)}</span>`).join("")}</div></div>
      <div class="perfil-acciones">${t.whatsapp ? `<a class="btn btn-wa" href="${S.wa(t.whatsapp, saludo)}" target="_blank" rel="noopener">${S.icono("whatsapp")} Contactar por WhatsApp</a>` : ""}${cx.externo ? `<a class="btn btn-dorado" href="${S.esc(cx.href)}" target="_blank" rel="noopener" data-visita="${S.esc(t.id)}">${S.esc(cx.texto === "Contactar" ? "Ver perfil digital" : cx.texto)}</a>` : ""}</div></section>
    ${t.descripcion ? `<p class="descripcion" style="margin-top:16px">${S.esc(t.descripcion)}</p>` : ""}
    ${articulos.length ? `<section class="seccion"><div class="seccion-cab"><h2>Ofertas y promociones</h2><p>${articulos.length} oferta${articulos.length === 1 ? "" : "s"}${tipos.length > 1 ? ` · ${tipos.join(", ")}` : ""}</p></div><div class="rejilla-art">${articulos.map(tarjeta).join("")}</div></section>`
      : `<section class="seccion"><div class="vacio">Esta tienda aún no publicó ofertas.${t.whatsapp ? " Escríbele por WhatsApp para consultar." : ""}</div></section>`}
    <footer class="pie"><span>${S.esc([sitio.nombre, sitio.direccion].filter(Boolean).join(" · "))}</span><span><a href="/tiendas">Ver todas las tiendas</a> · <a href="/ofertas">Todas las ofertas</a></span></footer>`;
  if (art) setTimeout(() => document.querySelector('[style*="outline"]')?.scrollIntoView({ behavior: "smooth", block: "center" }), 200);
})();
</script>
</body>
</html>
